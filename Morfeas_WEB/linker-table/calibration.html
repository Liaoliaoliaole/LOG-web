<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Channel Calibration</title>
    <link rel="stylesheet" href="../assets/app.css" />
    <style>
        .wrap {
            max-width: none;
            width: calc(100vw - 20px);
            margin: 8px auto;
        }

        .card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden
        }

        .card-head {
            padding: 16px 18px;
            border-bottom: 1px solid var(--border);
            font-weight: 900;
            font-size: 20px
        }

        .card-body {
            padding: 8px 12px 12px
        }

        .grid {
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 10px 14px;
            align-items: center;
            margin-bottom: 12px
        }

        .grid--info {
            margin-bottom: 18px
        }

        .label {
            font-weight: 800
        }

        .input--w80 {
            min-width: 80px;
            width: 80px;
            text-align: center
        }

        .input--w110 {
            min-width: 110px;
            width: 110px
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            background: #fff
        }

        .table th,
        .table td {
            border: 1px solid #e5e7eb;
            padding: 6px 8px;
            white-space: nowrap;
            text-align: left
        }

        .table thead th {
            background: #f3f4f6;
            font-weight: 800
        }

        .row-disabled {
            background: #f9fafb;
            opacity: .6
        }

        .cell-invalid {
            border-color: #dc2626 !important;
            background: #fef2f2 !important
        }

        .row-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 8px
        }

        .note {
            color: var(--muted);
            font-size: 14px
        }

        .btn.small {
            height: 34px;
            padding: 0 10px
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="card">
            <div class="card-head">Calibration</div>
            <div class="card-body">

                <!-- Channel & scope -->
                <div class="grid grid--info">
                    <div class="label">SerialNumber</div>
                    <div id="devSerial">-</div>

                    <div class="label">Type</div>
                    <div id="devType">-</div>

                    <div class="label">Available_Channels</div>
                    <div id="devAvailChannels">-</div>

                    <div class="label">Samplerate</div>
                    <div id="devSampleRate">-</div>

                    <div class="label">Max_num_of_cal_points</div>
                    <div id="devMaxPoints">-</div>

                    <div class="label">Channel</div>
                    <div id="channelFixed">-</div>
                </div>

                <div class="grid" style="grid-template-columns: 150px 150px 230px 100px 90px 130px 110px 90px;">
                    <div class="label">Calibration Date</div>
                    <div>
                        <input id="calDate" type="date" class="input input--w110" />
                    </div>

                    <div class="label">Re-Calibration Period (Months)</div>
                    <div>
                        <input id="calPeriod" type="number" min="0" class="input input--w80" />
                    </div>

                    <div class="label">CH's Unit</div>
                    <div>
                        <input id="unitBox" class="input input--w110" placeholder="°C, A, V" />
                    </div>

                    <div class="label">Used Points</div>
                    <div>
                        <input id="usedPoints" type="number" min="1" value="2" class="input input--w80" />
                    </div>
                </div>

                <!-- Points table -->
                <div class="table-wrap">
                    <table class="table" id="calTable">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Measure</th>
                                <th>Reference</th>
                                <th>Offset</th>
                                <th>Gain</th>
                                <th>C2</th>
                                <th>C3</th>
                            </tr>
                        </thead>
                        <tbody><!-- filled by JS --></tbody>
                    </table>
                </div>

                <div class="row-actions">
                    <button id="btnSave" class="btn primary">Save</button>
                </div>

                <div id="status" class="note" style="margin-top:8px"></div>
            </div>
        </div>
    </div>

    <script src="./calibration.js"></script>
    <script>
        // ESC to close the popup
        document.addEventListener('keydown', e => { if (e.key === 'Escape') window.close(); });
    </script>
</body>

</html>
