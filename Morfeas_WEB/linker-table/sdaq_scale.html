<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SDAQ Scale</title>
  <link rel="stylesheet" href="../assets/app.css" />
  <style>
    .wrap {
      max-width: 1320px;
      margin: 8px auto;
      padding: 0 10px;
    }

    .card {
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 14px;
      overflow: hidden;
    }

    .card-head {
      padding: 12px 16px;
      border-bottom: 1px solid var(--color-border);
      font-size: 20px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .body {
      padding: 12px;
      display: grid;
      gap: 12px;
    }

    .box {
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 10px 12px;
      background: #fff;
    }

    .box h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .kv {
      display: grid;
      grid-template-columns: 190px 1fr 190px 1fr;
      gap: 8px 10px;
      align-items: center;
    }

    .label {
      font-weight: 800;
      white-space: nowrap;
    }

    .scale-form {
      display: grid;
      gap: 10px;
      max-width: 760px;
    }

    .scale-row {
      display: grid;
      grid-template-columns: 240px minmax(220px, 1fr);
      gap: 12px;
      align-items: center;
    }

    .input.small {
      min-width: 0;
      width: 100%;
      height: 38px;
    }

    #engUnitInput {
      padding: 0 12px;
    }

    .preview {
      margin-top: 10px;
      border: 1px solid #dbeafe;
      background: #eff6ff;
      border-radius: 10px;
      padding: 10px;
      font-weight: 700;
      color: #1e3a5f;
      min-height: 42px;
      display: flex;
      align-items: center;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 10px;
    }

    #status {
      min-height: 22px;
      font-size: 14px;
      color: var(--color-muted);
      margin-top: 6px;
    }

    @media (max-width: 980px) {
      .kv {
        grid-template-columns: 1fr 1fr;
      }

      .scale-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="card-head">
        <span>SDAQ Scale</span>
        <span id="ctxText">-</span>
      </div>

      <div class="body">
        <div class="box">
          <h3>Channel Context</h3>
          <div class="kv">
            <div class="label">ISO Channel</div>
            <div id="isoText">-</div>

            <div class="label">Type</div>
            <div id="typeText">-</div>

            <div class="label">Serial Number</div>
            <div id="snText">-</div>

            <div class="label">Channel</div>
            <div id="channelText">-</div>
          </div>
        </div>

        <div class="box">
          <h3>Manual Scale</h3>
          <div class="scale-form">
            <div class="scale-row">
              <div class="label">Current Measurement Value</div>
              <input id="rawValue" class="input small" readonly />
            </div>

            <div class="scale-row">
              <div class="label">Measurement Input Low</div>
              <input id="rawLowValue" type="number" step="any" class="input small" />
            </div>

            <div class="scale-row">
              <div class="label">Measurement Input High</div>
              <input id="rawHighValue" type="number" step="any" class="input small" />
            </div>

            <div class="scale-row">
              <div class="label">Engineering Output Low</div>
              <input id="engLowValue" type="number" step="any" class="input small" />
            </div>

            <div class="scale-row">
              <div class="label">Engineering Output High</div>
              <input id="engHighValue" type="number" step="any" class="input small" />
            </div>

            <div class="scale-row">
              <div class="label">Engineering Unit</div>
              <input id="engUnitInput" class="input small" list="engUnitList" placeholder="Select unit" autocomplete="off" />
              <datalist id="engUnitList"></datalist>
            </div>
          </div>

          <div class="preview" id="scaledPreview">Scaled Output Value: -</div>

          <div class="actions">
            <button id="btnReset" class="btn" type="button">Reset</button>
            <button id="btnOpenCalibration" class="btn" type="button">Continue in Calibration</button>
            <button id="btnSave" class="btn primary" type="button">Save</button>
          </div>
          <div id="status"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/config.js"></script>
  <script src="../assets/services/sdaqCalibrationRules.js"></script>
  <script src="./sdaq_scale.js"></script>
</body>

</html>
