<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Replace TC16</title>
  <link rel="stylesheet" href="../assets/app.css" />
  <style>
    .dialog {
      max-width: 980px;
      margin: 24px auto;
      padding: 20px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 12px 30px rgba(0, 0, 0, .08);
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(24px, 2.6vw, 30px);
      font-weight: 900;
    }

    .statusbar {
      margin: 10px 0 16px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg-weak);
      font-weight: 700;
    }

    .section {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      background: #fff;
    }

    .section h2 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0;
    }

    .chip {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      background: var(--bg-weak);
      font-size: 12px;
      font-weight: 700;
    }

    .list {
      display: grid;
      gap: 8px;
      max-height: 360px;
      overflow: auto;
      padding-right: 4px;
    }

    .target {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      background: #fff;
      cursor: pointer;
    }

    .target:hover {
      border-color: var(--accent);
      background: #eef6ff;
    }

    .target.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(52, 152, 219, .18);
      background: #eef6ff;
    }

    .target .meta {
      color: var(--muted);
      font-size: 13px;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 14px;
    }
  </style>
</head>

<body>
  <main class="dialog">
    <h1>Replace TC16</h1>
    <div id="status" class="statusbar">Loading source group...</div>

    <section class="section">
      <h2>Source Group</h2>
      <div id="sourceSummary" class="mono">—</div>
      <div id="sourceChannels" class="chips"></div>
    </section>

    <section class="section">
      <h2>Target TC16 Device</h2>
      <div id="targetList" class="list"></div>
    </section>

    <div class="actions">
      <button id="btnRefresh" class="btn ghost" type="button">Refresh</button>
      <button id="btnApply" class="btn" type="button" disabled>Apply Replace TC16</button>
      <button id="btnClose" class="btn ghost" type="button">Close</button>
    </div>
  </main>

  <script src="../assets/config.js" defer></script>
  <script src="../assets/api/channels.js" defer></script>
  <script src="./replace_tc16.js" defer></script>
</body>

</html>
