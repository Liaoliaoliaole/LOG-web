<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Add Devices</title>

  <!-- Shared site theme -->
  <link rel="stylesheet" href="../../assets/app.css" />

  <style>
    /* Local layout; visuals come from the shared theme */
    .wrap {
      max-width: 1320px;
      margin: 10px auto;
    }

    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .card-head {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      font-weight: 900;
      font-size: 18px;
    }

    .card-body {
      padding: 8px 12px 12px;
    }

    .toolbar-mini {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .toolbar-mini .btn {
      height: 36px;
    }

    .table {
      width: 100%;
      background: #fff;
      min-width: 0;
      table-layout: auto;
    }

    .table thead th {
      background: #f3f4f6;
      font-weight: 800;
    }

    .table th,
    .table td {
      padding: 7px 8px;
      border: 1px solid #e5e7eb;
      white-space: nowrap;
    }

    /* Bus column: keep width consistent with neighboring columns */
    .table th:nth-child(3),
    .table td:nth-child(3) {
      width: 120px;
      display: table-cell;
      text-align: center;
    }

    .table td:nth-child(1),
    .table th:nth-child(1) {
      text-align: center;
      width: 48px;
    }

    .table td:nth-child(2),
    .table th:nth-child(2) {
      text-align: center;
      width: 64px;
    }

    .table .row:hover {
      background: var(--row-hover);
    }

    .table .row.selected {
      background: var(--row-selected);
    }

    .grid {
      width: 100%;
      border-collapse: collapse;
    }

    .grid th,
    .grid td {
      border-bottom: 1px solid #eef0f3;
      padding: 6px 6px;
      vertical-align: middle;
      white-space: nowrap;
    }

    .label {
      width: 140px;
      font-weight: 800;
    }

    .input {
      min-width: 120px;
    }

    .props-grid {
      display: grid;
      grid-template-columns: 140px 1fr 140px 1fr;
      gap: 6px 10px;
      align-items: center;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 10px;
    }


    /* Small status dots (reusing main palette) */
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
      border: 1px solid rgba(0, 0, 0, .12);
    }

    .st-Okay {
      background: var(--s-okay)
    }

    .st-Connected {
      background: var(--s-okay)
    }

    .st-Stall {
      background: var(--s-stall)
    }

    .st-NotConnected {
      background: var(--s-error)
    }

    .st-NotDetected {
      background: var(--s-unknown)
    }

    .st-Disabled {
      background: #9ca3af
    }

    .st-Error {
      background: var(--s-error)
    }

    .st-Offline {
      background: var(--s-unknown)
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <!-- ================================================================
           1) DEVICES TABLE (items appear here after Save)
           ================================================================ -->
    <div class="card">
      <div class="card-head">Devices</div>
      <div class="card-body">
        <div class="toolbar-mini">
          <button id="refreshBtn" class="btn">Refresh</button>
          <div style="flex:1"></div>
          <button id="removeBtn" class="btn" disabled>Remove</button>
          <button id="addBtn" class="btn primary">Add…</button>
        </div>

        <div class="table-wrap" style="background:#fff;border:1px solid var(--border);">
          <table class="table" id="devTable" aria-label="Added devices">
            <thead>
              <tr>
                <th><input id="mchk" type="checkbox" aria-label="Select all rows" /></th>
                <th>#</th>
                <th>Bus</th>
                <th>Device Type</th>
                <th>Device Name/Address</th>
                <th>IP Address</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="devBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ================================================================
           2) ADD FORM (hidden until “Add…” is clicked)
           ================================================================ -->
    <div id="propCard" class="card" style="margin-top:14px;display:none;">
      <div class="card-head">Add Device — Type & Properties</div>
      <div class="card-body">
        <div class="props-grid">
          <div class="label">Device Type</div>
          <div>
            <select id="devType" class="input" style="height:38px;min-width:180px;">
              <option value="NOX">NOX</option>
              <option value="IO-BOX">IO-BOX</option>
              <option value="MTI">MTI</option>
            </select>
          </div>

          <div class="label">CAN Interface</div>
          <div>
            <select id="canIf" class="input" style="height:38px;min-width:140px;">
              <option value="can0">can0</option>
              <option value="can1">can1</option>
            </select>
          </div>

          <div class="label">Device Name</div>
          <div>
            <input id="devName" class="input" style="min-width:280px" placeholder="e.g. SDAQ-RTD-01" />
          </div>

          <div class="label">IPv4 Address</div>
          <div>
            <input id="devIp" class="input" style="min-width:200px" placeholder="192.168.1.10" />
          </div>
        </div>

        <div class="actions">
          <button id="saveBtn" class="btn primary">Save</button>
          <button id="cancelBtn" class="btn">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../../assets/config.js"></script>
  <script src="../../assets/api/devices.js"></script>
  <script src="./devices.js"></script>
  <script>
    // Close this popup with ESC (consistent with other popups)
    document.addEventListener('keydown', e => { if (e.key === 'Escape') window.close(); });
  </script>
</body>

</html>
