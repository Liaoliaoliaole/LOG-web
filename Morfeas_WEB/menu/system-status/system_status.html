<!doctype html>
<html lang="en">

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>System Status</title>

    <!-- Shared site theme -->
    <link rel="stylesheet" href="../../assets/app.css" />

    <style>
    /* =========================================================================
       * Local layout (popup-sized card). Visuals inherit from the shared theme.
       * ========================================================================= */
    .wrap {
      max-width: 1380px;
      margin: 10px auto;
      padding: 0 10px;
    }

    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .card-head {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      font-weight: 900;
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-body {
      padding: 10px 14px 14px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .panel {
      display: none;
    }

    .panel.show {
      display: block;
    }

    /* Details grid: two columns on wide screens */
    .stack {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(auto-fit, minmax(520px, 1fr));
      align-items: start;
    }

    /* Table visuals (aligned with homepage) */
    .table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      min-width: 0;
      table-layout: auto;
    }

    .table th,
    .table td {
      border: 1px solid #e5e7eb;
      padding: 10px 12px;
      white-space: nowrap;
    }

    .table thead th {
      background: #f3f4f6;
      font-weight: 800;
    }

    /* Logs */
    .logs-bar {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .logs-bar.after-terminal {
      margin-top: 10px;
      margin-bottom: 0;
    }

    .label {
      width: 120px;
      font-weight: 800;
      padding-top: 8px;
    }

    .input[multiple] {
      min-height: 110px;
    }

    .terminal {
      background: #0b1020;
      color: #e5e7eb;
      border-radius: 12px;
      padding: 12px;
      min-height: 300px;
      overflow: auto;
      border: 1px solid var(--border);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
  </head>

  <body>
    <div class="wrap">
      <div class="card">
        <div class="card-head">
          System Status
        </div>

        <div class="card-body">
          <!-- Tabs -->
          <div class="tabs" role="tablist" aria-label="System status tabs">
            <button class="tab btn primary" data-tab="details" role="tab"
              aria-selected="true">Details</button>
            <button class="tab btn" data-tab="logs" role="tab"
              aria-selected="false">System logs</button>
            <button class="tab btn" data-tab="journal" role="tab"
              aria-selected="false">System Journal</button>
          </div>

          <!-- Details (BUS-related metrics are merged into the table) -->
          <section id="panel-details" class="panel show" role="tabpanel"
            aria-labelledby="details">
            <div id="detailsWrap" class="stack"></div>
          </section>

          <!-- TODO: System logs (placeholder) -->
          <section id="panel-logs" class="panel" role="tabpanel"
            aria-labelledby="logs" aria-live="polite">
            <div class="logs-bar">
              <label class="label" for="loggerSelect">Preview Logger</label>
              <select id="loggerSelect" class="input" aria-label="Preview log file">
                <option value>Select logger…</option>
              </select>
              <button id="reloadLoggers" class="btn">Reload</button>
            </div>
            <pre id="logTerminal" class="terminal"></pre>
            <div class="logs-bar after-terminal">
              <label class="label" for="loggerExportSelect">Export Logs</label>
              <select id="loggerExportSelect" class="input" multiple size="6" aria-label="Select logs to export"></select>
              <button id="exportLogs" class="btn">Export Selected</button>
            </div>
          </section>

          <section id="panel-journal" class="panel" role="tabpanel"
            aria-labelledby="journal" aria-live="polite">
            <div class="logs-bar">
              <label class="label" for="journalScope">Scope</label>
              <select id="journalScope" class="input" multiple size="4" aria-label="Journal scope">
                <option value="all" selected>All Services</option>
                <option value="morfeas">Morfeas System</option>
                <option value="apache2">Apache2</option>
                <option value="ssh">SSH</option>
              </select>
              <label class="label" for="journalLines">Lines</label>
              <select id="journalLines" class="input" aria-label="Journal lines">
                <option value="200">200</option>
                <option value="500" selected>500</option>
                <option value="1000">1000</option>
              </select>
              <button id="reloadJournal" class="btn">Reload</button>
              <button id="exportJournal" class="btn">Export Journal</button>
            </div>
            <pre id="journalTerminal" class="terminal"></pre>
          </section>
        </div>
      </div>
    </div>

  <!-- Scripts -->
  <script src="../../assets/config.js"></script>
  <script src="../../assets/api/systemStatus.js"></script>
  <script src="../../assets/ui/systemStatusFormatter.js"></script>
  <script src="./status.js"></script>
    <script>
    // Close popup with ESC (consistent with other popups)
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.close(); });
  </script>
  </body>

</html>
