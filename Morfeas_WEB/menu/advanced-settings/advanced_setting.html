<!doctype html>
<html lang="en">

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Advanced Settings</title>
    <link rel="stylesheet" href="../../assets/app.css" />
    <style>
    /* Layout */
    .wrap {
      max-width: 860px;
      margin: 16px auto;
    }

    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .card-head {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      font-weight: 900;
      font-size: var(--fz);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-body {
      padding: 12px 18px 18px;
    }

    .card,
    .card *:not(.btn):not(.muted) {
      color: var(--text);
      font-size: var(--fz);
    }

    .section {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }

    .section-title {
      font-weight: 900;
      margin-bottom: 6px;
    }

    .rows {
      display: grid;
      gap: 10px;
    }

    .row {
      display: grid;
      grid-template-columns: 160px 1fr;
      align-items: center;
      gap: 10px;
    }

    .row.tight {
      align-items: start;
    }

    .row.actions {
      grid-template-columns: 1fr auto auto;
      justify-content: end;
    }

    .row.actions .btn {
      justify-self: end;
    }

    .value {
      font-weight: 800;
    }

    .readonly {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #f9fafb;
      min-height: 42px;
      display: inline-flex;
      align-items: center;
    }

    /* Use normal text color for the “Source” path */
    .path {
      color: var(--text);
      font-weight: 600;
    }

    /* Only elements with .muted stay gray */
    .muted {
      color: var(--muted);
    }

    .sel {
      height: 42px;
      min-width: 160px;
    }

    /* Inputs/selects should follow theme color & size */
    .input,
    .sel,
    select,
    input,
    textarea {
      color: var(--text);
      font-size: var(--fz);
    }

    /* Table styling consistent with the main app */
    .table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }

    .table th,
    .table td {
      border: 1px solid #e5e7eb;
      padding: 10px 12px;
      white-space: nowrap;
      color: var(--text);
      font-size: var(--fz);
    }

    .table thead th {
      background: #f3f4f6;
      font-weight: 800;
    }

    .table-wrap {
      margin-top: 12px;
      overflow-x: auto;
    }

    #isoSelect {
      display: block;
      width: 100%;
      max-width: 420px;
    }
  </style>
  </head>

  <body>
    <div class="wrap">
      <div class="card">
        <div class="card-head">
          Advanced Settings
        </div>

        <div class="card-body">
          <!-- Machine Identifier -->
          <div class="section">
            <div class="section-title">Machine Identifier</div>
            <div class="rows">
              <div class="row">
                <label>MAC Address</label>
                <div id="macText" class="value">—</div>
              </div>
            </div>
          </div>

          <!-- SDAQNet (CAN-IFs) -->
          <div class="section">
            <div class="section-title">SDAQNet (CAN-IFs)</div>
            <div class="rows">
              <div class="row">
                <label>CAN0</label>
                <div id="can0" class="value readonly">—</div>
              </div>
              <div class="row">
                <label>CAN1</label>
                <div id="can1" class="value readonly">—</div>
              </div>
            </div>
          </div>

          <!-- Time Synchronization -->
          <div class="section">
            <div class="section-title">Time Synchronization</div>
            <div class="rows">
              <div class="row">
                <label>NTP Server</label>
                <div style="display:flex; align-items:center; gap:8px;">
                  <input id="ntpServerInput" class="input" style="min-width:180px" placeholder="e.g. 192.168.1.10" />
                  <button id="ntpApplyBtn" class="btn" type="button">Apply</button>
                </div>
              </div>
              <div class="row">
                <label></label>
                <div id="ntpStatus" class="muted">—</div>
              </div>
            </div>
          </div>

          <!-- ISOstandard -->
          <div class="section">
            <div class="section-title">ISOstandard</div>
            <div class="rows">
              <div class="row">
                <label>Source</label>
                <div>
                  <div class="value path"
                    id="isoPath">—</div>
                </div>
              </div>
              <div class="row tight">
                <label>Choose file</label>
                <div>
                  <div class="row actions"
                    style="grid-template-columns: 1fr auto; gap: 8px;">
                    <select id="isoSelect" class="input sel"
                      style="margin-bottom:6px;"></select>
                    <button id="isoUploadBtn" class="btn" type="button">Upload
                      new ISOStandard</button>
                  </div>
                  <input id="isoUploadInput" type="file" accept=".xml"
                    style="display:none" />
                  <div class="muted">The selected XML applies system-wide and is
                    used when adding or editing ISO channels.</div>
                </div>
              </div>
              <div class="table-wrap">
                <table class="table" id="isoTable">
                  <thead>
                    <tr>
                      <th>#</th>
                      <th>NAME</th>
                      <th>DESCRIPTION</th>
                      <th>UNIT</th>
                      <th>MAX</th>
                      <th>MIN</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
              <div id="isoEmpty" class="muted" style="display:none;">No
                ISOstandard loaded.</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Optional: include the original validator if want to reuse it for local-file fallback -->
    <!-- <script src="../../isoSTD_xml_file_validation.js"></script> -->
    <script src="../../assets/config.js"></script>
    <script src="../../assets/api/channels.js"></script>
    <script src="../../assets/api/networkConfig.js"></script>
    <script src="../../assets/services/isoCatalog.js"></script>
    <script src="./advanced.js"></script>
    <script>document.addEventListener('keydown', e => { if (e.key === 'Escape') window.close(); });</script>
  </body>

</html>
