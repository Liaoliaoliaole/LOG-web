<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Device Search</title>
    <link rel="stylesheet" href="../assets/app.css" />
    <style>
        main {
            max-width: 960px;
            margin: 20px auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .title {
            font-size: clamp(22px, 3vw, 28px);
            font-weight: 900;
        }

        .muted {
            color: var(--muted);
        }

        .card {
            margin-top: 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg);
            box-shadow: 0 6px 18px rgba(0, 0, 0, .08);
        }

        .card header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
        }

        .card .body {
            padding: 12px 16px;
        }

        .list {
            display: grid;
            gap: 8px;
        }

        .row {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr 120px;
            align-items: center;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg-weak);
            cursor: pointer;
            transition: border-color .15s ease, background-color .15s ease;
        }

        .row:hover {
            border-color: var(--accent);
            background: #eef6ff;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 12px;
            background: var(--bg-weak);
            border: 1px solid var(--border);
        }

        .empty {
            padding: 18px;
            text-align: center;
            color: var(--muted);
        }
    </style>
</head>

<body>
    <main>
        <div class="header">
            <div class="title">Device Search</div>
            <div id="typeLabel" class="badge muted"></div>
        </div>

        <div class="card">
            <header>
                <div id="status" class="muted">Loading...</div>
            </header>
            <div class="body">
                <div id="list" class="list"></div>
            </div>
        </div>
    </main>

    <script src="./device_search.js" defer></script>
</body>

</html>
