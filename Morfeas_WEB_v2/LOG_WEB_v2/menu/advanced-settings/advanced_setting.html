<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Advanced Settings</title>
  <link rel="stylesheet" href="../../assets/app.css" />
  <style>
    /* Layout */
    .wrap {
      max-width: 860px;
      margin: 16px auto;
    }
  
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
  
    .card-head {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      font-weight: 900;
      font-size: var(--fz); 
      display: flex;
      align-items: center;
      gap: 10px;
    }
  
    .mock-badge {
      margin-left: auto;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      color: #1f2937;
      background: linear-gradient(#fde68a, #fcd34d);
      border: 1px solid #f59e0b;
    }
  
    .card-body {
      padding: 12px 18px 18px;
    }

    .card,
    .card *:not(.btn):not(.muted) {
      color: var(--text);
      font-size: var(--fz);
    }
  
    .section {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
  
    .section-title {
      font-weight: 900;
      margin-bottom: 6px;
    }
  
    .rows {
      display: grid;
      gap: 10px;
    }
  
    .row {
      display: grid;
      grid-template-columns: 160px 1fr;
      align-items: center;
      gap: 10px;
    }
  
    .row.actions {
      grid-template-columns: 1fr auto auto;
      justify-content: end;
    }
  
    .row.actions .btn {
      justify-self: end;
    }
  
    .value {
      font-weight: 800;
    }
  
    /* Use normal text color for the “Source” path */
    .path {
      color: var(--text);
      font-weight: 600;
    }
  
    /* Only elements with .muted stay gray */
    .muted {
      color: var(--muted);
    }
  
    .sel {
      height: 42px;
      min-width: 160px;
    }
  
    /* Inputs/selects should follow theme color & size */
    .input,
    .sel,
    select,
    input,
    textarea {
      color: var(--text);
      font-size: var(--fz);
    }
  
    /* Table styling consistent with the main app */
    .table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }
  
    .table th,
    .table td {
      border: 1px solid #e5e7eb;
      padding: 10px 12px;
      white-space: nowrap;
      color: var(--text);
      font-size: var(--fz);
    }
  
    .table thead th {
      background: #f3f4f6;
      font-weight: 800;
    }
  </style>  
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="card-head">
        Advanced Settings
        <span id="mockBadge" class="mock-badge">MOCK DATA</span>
      </div>

      <div class="card-body">
        <!-- Machine Identifier -->
        <div class="section">
          <div class="section-title">Machine Identifier</div>
          <div class="rows">
            <div class="row">
              <label>MAC Address</label>
              <div id="macText" class="value">—</div>
            </div>
          </div>
        </div>

        <!-- SDAQNet (CAN-IFs) -->
        <div class="section">
          <div class="section-title">SDAQNet (CAN-IFs)</div>
          <div class="rows">
            <div class="row">
              <label>CAN0</label>
              <select id="can0" class="input sel">
                <option>125 kbps</option>
                <option>250 kbps</option>
                <option selected>500 kbps</option>
                <option>1000 kbps</option>
              </select>
            </div>
            <div class="row">
              <label>CAN1</label>
              <select id="can1" class="input sel">
                <option>125 kbps</option>
                <option>250 kbps</option>
                <option selected>500 kbps</option>
                <option>1000 kbps</option>
              </select>
            </div>
            <div class="row actions">
              <button id="loadLast" class="btn">Load Last</button>
              <button id="apply" class="btn primary">Set</button>
            </div>
          </div>
        </div>

        <!-- ISOstandard -->
        <div class="section">
          <div class="section-title">ISOstandard</div>
          <div class="rows">
            <div class="row">
              <label>Source</label>
              <div class="value path" id="isoPath">ISOstandard.xml</div>
            </div>
            <div class="table-wrap">
              <table class="table" id="isoTable">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>NAME</th>
                    <th>DESCRIPTION</th>
                    <th>UNIT</th>
                    <th>MAX</th>
                    <th>MIN</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
            <div id="isoEmpty" class="muted" style="display:none;">No ISOstandard loaded.</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Optional: include the original validator if want to reuse it for local-file fallback -->
  <!-- <script src="../../isoSTD_xml_file_validation.js"></script> -->
  <script src="./advanced.js"></script>
  <script>document.addEventListener('keydown', e => { if (e.key === 'Escape') window.close(); });</script>
</body>

</html>
