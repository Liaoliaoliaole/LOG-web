<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Advanced Settings</title>
  <link rel="stylesheet" href="../assets/app.css" />
  <link rel="stylesheet" href="./advanced.css" />
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="card-head">
        Advanced Settings
        <span id="mockBadge" class="mock-badge">MOCK DATA</span>
      </div>
      <div class="card-body">
        <!-- ① Machine Identifier (只展示 MAC) -->
        <div class="group">
          <div class="group-title">Machine Identifier</div>
          <div class="rows">
            <div class="row">
              <label>MAC Address</label>
              <div id="macText" class="value">—</div>
            </div>
          </div>
        </div>

        <!-- ② SDAQNet (CAN-IFs) bit-rate -->
        <div class="group">
          <div class="group-title">SDAQNet (CAN-IFs)</div>
          <div class="rows">
            <div class="row">
              <label>CAN0</label>
              <select id="can0" class="input sel">
                <option>125 kbps</option>
                <option>250 kbps</option>
                <option selected>500 kbps</option>
                <option>1000 kbps</option>
              </select>
            </div>
            <div class="row">
              <label>CAN1</label>
              <select id="can1" class="input sel">
                <option>125 kbps</option>
                <option>250 kbps</option>
                <option selected>500 kbps</option>
                <option>1000 kbps</option>
              </select>
            </div>
            <div class="row actions">
              <button id="loadLast" class="btn">Load Last</button>
              <button id="apply" class="btn primary">Set</button>
            </div>
          </div>
        </div>

        <!-- ③ ISOstandard 展示 -->
        <div class="group">
          <div class="group-title">ISOstandard</div>
          <div class="rows">
            <div class="row">
              <label>Source</label>
              <div class="value path" id="isoPath">advanced-settings/ISOstandard.xml</div>
            </div>
            <div class="table-wrap">
              <table class="table" id="isoTable">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>NAME</th>
                    <th>DESCRIPTION</th>
                    <th>UNIT</th>
                    <th>MAX</th>
                    <th>MIN</th>
                  </tr>
                </thead>
                <tbody><!-- filled by JS --></tbody>
              </table>
            </div>
            <div id="isoEmpty" class="muted" style="display:none;">No ISOstandard loaded (mock).</div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="./advanced.js"></script>
  <script>document.addEventListener('keydown', e => { if (e.key === 'Escape') window.close(); });</script>
</body>

</html>
