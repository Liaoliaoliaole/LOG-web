<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit Link</title>

    <!-- Use the same theme as the main page -->
    <link rel="stylesheet" href="../assets/app.css" />

    <style>
        /* Dialog shell */
        .dialog {
            max-width: 880px;
            margin: 24px auto;
            padding: 20px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 12px 30px rgba(0, 0, 0, .08);
        }

        h1 {
            margin: 0 0 14px;
            font-size: clamp(24px, 2.6vw, 30px);
            font-weight: 900
        }

        /* Top “status” strip (same tone as other popups) */
        .statusbar {
            margin: 10px 0 16px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--bg-weak);
            font-weight: 700;
        }

        /* 2-column form grid */
        .formgrid {
            display: grid !important;
            grid-template-columns: 220px 1fr;
            gap: 14px 16px;
            align-items: center;
        }

        .label {
            font-weight: 700
        }

        .inline {
            display: inline-flex;
            align-items: center;
            gap: 8px
        }

        .row-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 18px
        }

        .w-92 {
            width: 92px
        }

        .w-120 {
            width: 120px
        }

        /* ISO dropdown styling (shared with Link Creator) */
        .iso-field {
            align-items: center;
            flex-direction: row;
            gap: 6px;
            flex-wrap: nowrap;
        }

        .iso-input-wrap {
            position: relative;
            display: inline-block;
            min-width: 110px;
            max-width: 240px;
            width: auto;
            flex: 0 0 auto;
        }

        .iso-suggestions {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            width: 100%;
            min-width: 100%;
            max-height: 260px;
            padding: 6px 0;
            background: #fff;
            opacity: 1;
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, .18);
            overflow-y: auto;
            z-index: 20;
        }

        .iso-suggestions.hidden {
            display: none;
        }

        .iso-suggestion {
            padding: 8px 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .iso-suggestion:hover,
        .iso-suggestion.active {
            background: rgba(52, 152, 219, .12);
        }

        .iso-suggestion .title {
            font-weight: 800;
        }

        .iso-suggestion .meta {
            color: var(--muted);
            font-size: 13px;
        }

        .hidden {
            display: none;
        }

    .disabled {
      opacity: .6;
      pointer-events: none;
    }

    .cal-data {
      display: none;
    }

        /* Make read-only fields visually consistent with disabled look */
        .ro {
            background: var(--bg-weak) !important;
            color: var(--muted) !important;
        }

        /* Tighten small inputs used beside checkboxes */
        .num {
            width: 140px;
        }

        /* THEME-CONSISTENT DROPDOWN HIGHLIGHT */
        select.input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, .15);
        }

        select.input option:checked {
            background: var(--accent) !important;
            color: #fff !important;
        }

        select.input option:hover {
            background: rgba(52, 152, 219, .15) !important;
            color: var(--text);
        }
    </style>
</head>

<body>
    <main class="dialog">
        <h1>Edit Link</h1>

        <!-- Live validation / operation feedback -->
        <div id="status" class="statusbar">Review and update fields, then Save.</div>

        <div class="formgrid" id="formGrid">

            <!-- Type (read-only like the original) -->
            <div class="label">Type</div>
            <div>
                <select id="type" class="input w-120 ro" disabled>
                    <option value>-</option>
                    <option value="SDAQ">SDAQ</option>
                    <option value="IOBOX">IOBOX</option>
                    <option value="MTI">MTI</option>
                    <option value="NOX">NOX</option>
                </select>
            </div>

            <!-- Sensor Path -->
            <div class="label">Sensor's Path</div>
            <div class="inline">
                <input id="path" class="input" placeholder="Select from search" />
                <button id="btnSearch" class="btn" title="Search">🔍</button>
            </div>

            <!-- ISO Code -->
            <div class="label">ISO Code</div>
            <div class="inline iso-field">
                <div class="iso-input-wrap">
                    <input id="iso" class="input w-120" placeholder="Search..." />
                    <div id="isoDropdown" class="iso-suggestions hidden"></div>
                </div>
            </div>

            <!-- Description -->
            <div class="label">Description</div>
            <div><input id="desc" class="input" placeholder="Description" /></div>

            <!-- Min -->
            <div class="label">Min</div>
            <div><input id="min" type="number" class="input num" /></div>

            <!-- Max -->
            <div class="label">Max</div>
            <div><input id="max" type="number" class="input num" /></div>

            <!-- Alarm Low -->
            <div class="label">Alarm Low</div>
            <div class="inline">
                <input id="alarmLowVal" type="number" class="input num" />
                <label class="inline">
                    <input id="alarmLow" type="checkbox" /> Enable
                </label>
            </div>

            <!-- Alarm High -->
            <div class="label">Alarm High</div>
            <div class="inline">
                <input id="alarmHighVal" type="number" class="input num" />
                <label class="inline">
                    <input id="alarmHigh" type="checkbox" /> Enable
                </label>
            </div>

            <!-- Cal Date -->
            <div class="label cal-data">Cal Date</div>
            <div class="cal-data"><input id="calDate" type="date" class="input num" /></div>

            <!-- Cal Period -->
            <div class="label cal-data">Cal Period</div>
            <div class="cal-data"><input id="calPeriod" type="number" min="1" max="255" class="input num" /></div>

            <!-- Unit -->
            <div class="label">Unit</div>
            <div><input id="unit" class="input w-120" placeholder="°C, A, %" /></div>
        </div>

        <div class="row-actions">
            <button id="btnSave" class="btn primary">Save</button>
            <button id="btnCancel" class="btn">Cancel</button>
        </div>
    </main>

    <script src="./editCh.js" defer></script>
</body>

</html>
